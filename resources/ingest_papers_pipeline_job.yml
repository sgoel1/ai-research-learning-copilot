# Databricks Workflow that runs notebooks/ingest_papers_pipeline.py on a
# schedule. The notebook reads topic keywords from every active learning
# goal (falling back to a seed list on a fresh install), searches OpenAlex
# for matching papers, and turns them into papers/authors/paper_authors
# rows plus pgvector abstract embeddings for the context-engineering
# retrieval used by search_papers_semantic.
#
# Deploy: databricks bundle deploy -t dev
# Run once manually: databricks bundle run ingest_papers_pipeline_job -t dev

resources:
  jobs:
    ingest_papers_pipeline_job:
      name: "[${bundle.target}] Ingest Papers Pipeline"

      # Runs daily at 6:00 AM UTC. Adjust to match your class schedule.
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: "UTC"
        pause_status: PAUSED  # flip to UNPAUSED once you've validated a manual run

      email_notifications:
        on_failure:
          - ${workspace.current_user.userName}

      max_concurrent_runs: 1

      job_clusters:
        - job_cluster_key: default_cluster
          new_cluster:
            spark_version: "15.4.x-scala2.12"
            node_type_id: "i3.xlarge"
            num_workers: 2
            data_security_mode: SINGLE_USER

      tasks:
        - task_key: ingest_papers_pipeline
          job_cluster_key: default_cluster
          notebook_task:
            notebook_path: ../notebooks/ingest_papers_pipeline.py
            base_parameters:
              learning_goals_table_name: "learning_goals"
              papers_table_name: "papers"
              authors_table_name: "authors"
              paper_authors_table_name: "paper_authors"
              content_embeddings_table_name: "content_embeddings"
              embedding_model: "sentence-transformers/all-MiniLM-L6-v2"
              seed_topics: "large language models, retrieval augmented generation, transformer architecture, vector databases"
              papers_per_topic: "15"
              openalex_mailto: "surajgoel1997@gmail.com"
              embedding_partitions: "4"
